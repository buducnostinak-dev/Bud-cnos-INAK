:root {
  --orange: #F26A42; --orange-light: #FDE8E0; --orange-dark: #C94E28;
  --black: #111111; --gray-700: #444444; --gray-500: #6F6F6F; --gray-300: #CCCCCC;
  --gray-100: #F2F2F0; --gray-50: #F8F8F6; --white: #FFFFFF;
  --font: 'Lexend Deca Alt', system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  font-size: clamp(14px, 0.95vw + 2px, 22px);
}
*, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { font-family: var(--font); background: var(--white); color: var(--black); -webkit-font-smoothing: antialiased; min-height: 100%; }
button { font-family: inherit; cursor: pointer; }
button:focus-visible, .card:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }

.topbar { background: var(--black); color: var(--white); display: flex; align-items: center; justify-content: space-between; padding: 0.9rem 2rem; gap: 1rem; transition: background .2s; }
.y2 .topbar { background: var(--orange); color: var(--black); }
.brand { font-weight: 800; font-size: 1rem; letter-spacing: -0.01em; }
.brand span { font-weight: 400; opacity: .7; margin-left: .5rem; }
.switch { display: flex; gap: .4rem; }
.switch button { border: 1.5px solid currentColor; background: transparent; color: inherit; padding: .45rem 1.2rem; border-radius: 999px; font-size: .85rem; font-weight: 600; }
.switch button.on { background: var(--orange); border-color: var(--orange); color: var(--white); }
.y2 .switch button.on { background: var(--black); border-color: var(--black); color: var(--orange); }

.hero { padding: 2.4rem 2rem 1.8rem; border-bottom: 1px solid var(--gray-300); }
.hero h1 { font-size: 2.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; line-height: 1.1; }
.hero h1 b { color: var(--orange); font-weight: 800; }
.hero p { margin-top: .6rem; font-size: 1.05rem; color: var(--gray-700); max-width: 46rem; line-height: 1.5; }

.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--gray-300); border-bottom: 1px solid var(--gray-300); }
.card { background: var(--white); padding: 1.8rem 1.5rem 1.6rem; cursor: pointer; position: relative; display: flex; flex-direction: column; text-align: left; border: 0; color: inherit; font-size: 1rem; }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--orange); transform: scaleX(0); transform-origin: left; transition: transform .2s; }
.card:hover { background: var(--gray-50); }
.card:hover::before, .card.now::before { transform: scaleX(1); }
.num { display: flex; align-items: center; gap: .5rem; color: var(--orange); font-weight: 600; font-size: .85rem; margin-bottom: .6rem; }
.num i { font-style: normal; background: var(--black); color: var(--white); width: 1.7rem; height: 1.7rem; border-radius: 5px; display: grid; place-items: center; font-size: .8rem; }
.now-tag { margin-left: auto; background: var(--orange); color: var(--white); font-size: .7rem; font-weight: 600; padding: .2rem .55rem; border-radius: 999px; }
.period { font-size: .75rem; color: var(--gray-500); text-transform: uppercase; letter-spacing: .06em; margin-bottom: .35rem; }
.title { font-size: 1.3rem; font-weight: 700; line-height: 1.2; }
.focus { font-size: .85rem; font-weight: 600; color: var(--orange-dark); margin-top: .35rem; line-height: 1.35; }
.divider { height: 1px; background: var(--gray-100); margin: 1rem 0; }
.label { font-size: .72rem; color: var(--gray-500); text-transform: uppercase; letter-spacing: .08em; margin-bottom: .6rem; }
.goal { display: flex; gap: .55rem; font-size: .9rem; line-height: 1.45; color: var(--gray-700); margin-bottom: .55rem; }
.goal .g { flex: none; width: 1.3rem; height: 1.3rem; border-radius: 50%; background: var(--orange-light); color: var(--orange-dark); font-size: .7rem; font-weight: 700; display: grid; place-items: center; margin-top: .1rem; }
.icons { display: flex; flex-wrap: wrap; gap: .45rem; margin: .4rem 0 1.2rem; }
.icons span { width: 2.4rem; height: 2.4rem; border: 1px solid var(--gray-300); border-radius: 8px; display: grid; place-items: center; font-size: 1.2rem; background: var(--white); }
.lvl { margin-top: auto; background: var(--gray-50); border-radius: 8px; padding: .9rem 1rem; font-size: .85rem; line-height: 1.45; color: var(--gray-700); }
.lvl strong { display: block; color: var(--orange); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; margin-bottom: .35rem; }
.open-hint { margin-top: .9rem; font-size: .78rem; color: var(--gray-500); }

.yearbar { display: flex; justify-content: space-between; align-items: center; padding: 1.1rem 2rem; font-size: .85rem; }
.yearbar .k { color: var(--gray-500); text-transform: uppercase; letter-spacing: .12em; font-weight: 600; }
.yearbar .v { font-weight: 600; }

/* DETAIL */
.d-hero { background: var(--black); color: var(--white); padding: 2.2rem 2rem 2rem; }
.y2 .d-hero { background: var(--orange); color: var(--black); }
.d-nav { display: flex; gap: .5rem; margin-bottom: 1.6rem; flex-wrap: wrap; }
.d-nav button { background: transparent; color: inherit; border: 1.5px solid currentColor; border-radius: 999px; padding: .45rem 1.1rem; font-size: .85rem; font-weight: 600; opacity: .85; }
.d-nav button:hover { opacity: 1; }
.d-nav button:disabled { opacity: .3; cursor: default; }
.d-nav .sp { flex: 1; }
.d-eyebrow { font-size: .9rem; font-weight: 600; color: var(--orange); margin-bottom: .5rem; }
.y2 .d-eyebrow { color: var(--black); opacity: .7; }
.d-title { font-size: 3rem; font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; line-height: 1.05; }
.d-focus { font-size: 1.25rem; font-weight: 500; margin-top: .6rem; opacity: .8; }
.d-body { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--gray-300); border-bottom: 1px solid var(--gray-300); }
.d-col { background: var(--white); padding: 2rem; }
.d-col .label { font-size: .8rem; margin-bottom: 1.1rem; }
.d-goal { display: flex; gap: .9rem; font-size: 1.3rem; line-height: 1.45; margin-bottom: 1.2rem; }
.d-goal .g { flex: none; width: 2.1rem; height: 2.1rem; border-radius: 50%; background: var(--orange); color: var(--white); font-weight: 700; font-size: 1rem; display: grid; place-items: center; margin-top: .05rem; }
.act { display: flex; width: 100%; gap: .9rem; align-items: flex-start; padding: .85rem 0; border-top: 1px solid var(--gray-100); }
.act:first-of-type { border-top: 0; padding-top: 0; }
.act .ic { flex: none; width: 2.8rem; height: 2.8rem; border: 1px solid var(--gray-300); border-radius: 10px; display: grid; place-items: center; font-size: 1.45rem; }
.act h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: .2rem; }
.act p { font-size: 1rem; color: var(--gray-700); line-height: 1.45; }
.d-lvl { margin: 2rem; background: var(--orange-light); border-radius: 12px; padding: 1.4rem 1.6rem; font-size: 1.3rem; line-height: 1.45; }
.d-lvl strong { color: var(--orange-dark); }



.strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: .4rem; margin-bottom: 2rem; }
.strip button { text-align: left; background: rgba(255,255,255,.08); color: inherit; border: 0; border-top: 4px solid rgba(255,255,255,.25); border-radius: 0 0 8px 8px; padding: .7rem .8rem .8rem; font-size: .85rem; line-height: 1.3; }
.strip button:hover { background: rgba(255,255,255,.16); }
.strip button.on { background: var(--orange); border-top-color: var(--white); color: var(--white); }
.strip .s-n { display: block; font-weight: 700; margin-bottom: .2rem; }
.strip .s-p { display: block; font-size: .72rem; opacity: .75; margin-top: .25rem; }
.strip .s-now { display: inline-block; margin-left: .35rem; font-size: .65rem; font-weight: 700; background: var(--white); color: var(--orange-dark); border-radius: 999px; padding: .05rem .45rem; vertical-align: 1px; }
.y2 .strip button { background: rgba(0,0,0,.06); border-top-color: rgba(0,0,0,.2); }
.y2 .strip button:hover { background: rgba(0,0,0,.12); }
.y2 .strip button.on { background: var(--black); border-top-color: var(--black); color: var(--orange); }
.y2 .strip .s-now { background: var(--black); color: var(--orange); }
.y2 .strip button.on .s-now { background: var(--orange); color: var(--black); }
@media (max-width: 800px) { .strip { grid-template-columns: 1fr; } }

/* AKTIVITY A STRETNUTIA */
button.act { width: 100%; background: transparent; border: 0; border-top: 1px solid var(--gray-100); text-align: left; color: inherit; font-size: 1rem; border-radius: 0; }
button.act:first-of-type { border-top: 0; }
button.act:hover h3 { color: var(--orange-dark); }
.pill { display: inline-block; margin-top: .45rem; font-size: .78rem; font-weight: 600; color: var(--orange-dark); background: var(--orange-light); border-radius: 999px; padding: .2rem .7rem; }
.view { display: none; }
body[data-view="map"] #map, body[data-view="level"] #detail, body[data-view="act"] #actv, body[data-view="lp"] #lpv { display: block; }
.wrap { padding: 2rem; max-width: 80rem; }
.lp-card { display: block; width: 100%; text-align: left; background: var(--white); border: 1px solid var(--gray-300); border-radius: 12px; padding: 1.4rem 1.6rem; margin-bottom: 1rem; color: inherit; font-size: 1rem; }
.lp-card:hover { border-color: var(--orange); background: var(--gray-50); }

const LP = {"terenne-patranie": [{"name": "Think like a traveler", "sum": "Budeš vedieť ukázať jednu vec vo svojom okolí, ktorá funguje, a jednu, ktorá je problém – a dá sa s ňou niečo urobiť.", "groups": [{"name": "Energizér: Objavovanie tajomného kmeňa", "qs": ["(Objavitelia) Pomohlo vám to, čo ste si na začiatku povedali, že by vám mohlo pomôcť? Alebo ste nakoniec robili niečo úplne iné?", "(Kmeň) Mali ste naozaj všetko dohodnuté, čo ste na začiatku povedali, že potrebujete? Alebo sa počas hry ukázalo, že niečo chýbalo?", "Zažili ste podobné \"nevedel som, ako to tu chodí\" aj naozaj?"]}, {"name": "Cestovateľ na známom mieste", "qs": ["Čo ťa prekvapilo — na mieste, alebo na sebe?", "Bolo to tak, ako ste si na začiatku tipli — nájsť problém alebo nájsť to, čo funguje?"]}, {"name": "Prezentácia zistení", "qs": ["Ako ste sa dopracovali k tomu, čo tá osoba/miesto naozaj potrebuje? Čo vám pri tom pomohlo prísť na to?", "Čo si o sebe dnes zistil, čo si predtým nevedel?"]}]}], "mini-interview": [{"name": "Interview – Go outside", "sum": "Budeš vedieť povedať, čo ti pri rozhovore s človekom fungovalo a čo nie, a čo skúsiš nabudúce inak.", "groups": [{"name": "Energizér: Čelovka", "qs": ["Aké otázky vám pomáhali najviac?", "Zmenil sa spôsob, akým sa pýtaš, niekde v priebehu hry? Čo ťa k tomu viedlo?", "Kde v škole alebo v živote využiješ schopnosť klásť otázky?"]}, {"name": "Interview s neznámym človekom", "qs": ["Ako ľudia reagovali, keď ste ich oslovili? Prekvapilo vás niečo?", "Prečo je lepšie pýtať sa priamo ľudí, než si o probléme mesta len myslieť niečo sami?", "Odmietol vás niekto? Ako ste sa cítili a čo ste urobili ďalej?"]}, {"name": "Appreciation – Aha! – Action", "qs": ["Ktoré z troch \"A\" sa ti písalo najľahšie a ktoré najťažšie? Prečo?", "Kde inde v živote by sa ti zišlo vedieť si takto rýchlo uvedomiť vlastný posun?"]}]}], "mystery-challenge": [{"name": "Vstup — Escape room", "sum": "Cez escape room objavíš, aký je podnikavý človek – na príbehu M. R. Štefánika – a oficiálne vstúpiš do Budúcnosti INAK.", "groups": [{"name": "Finále — Denník a slávnostný vstup", "qs": ["Čo sa stalo? Ktoré stanovište bolo najťažšie a prečo?", "Čo z toho, čo použil Štefánik, ste dnes použili aj vy ako tím?", "Ako sa vám darilo riešiť problémy alebo konflikty?", "Kde vo svojom živote môžete použiť princíp \"ukáž druhému, čo z toho bude mať on\"?", "Aký je podnikavý človek?"]}]}], "co-nas-stve": [{"name": "Painstorming", "sum": "Vyskúšaš si painstorming: najprv hľadáme problémy, lebo z nich sa rodia nápady.", "groups": [{"name": "Energizér – Problémy a riešenia", "qs": ["Ktoré v dvojici boli problémy a ktoré riešenia?", "Čo majú spoločné všetky vynálezy, ktoré ste našli?"]}, {"name": "World café – Painstorming v skupinách", "qs": ["Bolo jednoduchšie nájsť problémy alebo riešenia? Prečo?", "Zmenil sa niekde váš pohľad na problém, keď k stolu prišli noví ľudia?", "Myslíte si, že v daných problémoch je niečo, čo by ste vedeli vyriešiť aj vy sami?"]}]}, {"name": "Patch Notes", "sum": "Budeš vedieť povedať, čo fungovalo, čo nie a čo skúsiš nabudúce – ako keď hra dostane novú verziu.", "groups": [{"name": "Energizér: Slepá veža", "qs": ["Tak, aké to bolo stavať?"]}, {"name": "Patch Notes: Verzia 1.0 → 2.0", "qs": ["Fungoval postup, ktorý ste si na začiatku zvolili, alebo ste ho musel/i počas stavby zmeniť?", "Je rozdiel medzi \"bolo to zlé\" a \"toto konkrétne nefungovalo, skúsime toto\"? Aký?"]}, {"name": "Moje Patch Notes", "qs": ["Čo si sa o sebe dozvedel, čo si predtým nevedel?", "Kde inde v živote by sa ti oplatilo takto si napísať vlastné patch notes?"]}]}, {"name": "Stretnutie – Spätná väzba", "sum": "Spoznáš rozdiel medzi spätnou väzbou, ktorá pomáha, a obyčajnou kritikou. A vyskúšaš si ju dávať aj prijímať.", "groups": [{"name": "Úvodná spätná väzba – obálky", "qs": ["Bolo v obálke niečo, čo ťa prekvapilo, alebo to sedelo s tým, čo si o sebe už vedel/a?"]}, {"name": "Energizér – Obrátená deka", "qs": ["Zlepšili sa horolezci medzi kolom 1 a kolom 2? Čo presne to spôsobilo?", "Bola spätná väzba od base campu konkrétna a použiteľná, alebo len všeobecná („bolo to fajn“, „bol tam chaos“)? Ako ste to poznali?", "Čo by sa stalo, keby base camp povedal len „bolo to super“ alebo „bolo to zlé“ bez ničoho ďalšieho?"]}, {"name": "Aktivita – Airbnb", "qs": ["Ktoré komentáre vám robili najväčší problém zaradiť – a zhodli ste sa v tíme hneď, alebo ste sa museli dohodnúť?", "Dá sa z toho, čo bola a nebola spätná väzba, vytvoriť jedno pravidlo, ktoré si zapamätáte aj mimo tejto aktivity?", "Kde vo vašom bežnom živote – škola, kamaráti, šport, sociálne siete – sa stretávate s podobným rozdielom medzi ozajstnou spätnou väzbou a len kritikou alebo posmeškom?"]}, {"name": "Na konci stretnutia – spätná väzba účastníkov", "qs": ["Kde inde by sa ti zišlo vedieť dať spätnú väzbu takto konkrétne — nie len \"bolo to fajn\"?", "Čo si sa dnes o sebe dozvedel?"]}]}], "timove-dohody": [{"name": "Let's start", "sum": "Nájdeš niečo, čo máš spoločné s niekým zo skupiny, pomenuješ, v čom je naša skupina silná, a povieš, na čo sa tešíš a čoho sa bojíš.", "groups": [{"name": "Úvod & Menovky", "qs": ["Čo si odnášaš z dnešného úvodu? Jedno slovo."]}, {"name": "Energizer: Spoločné body", "qs": ["Bolo ťažké nájsť spoločné veci? Prečo áno/nie?", "Čo ste zistili o seba navzájom?"]}, {"name": "Hra My Place", "qs": ["Čo vám ako skupine pomohlo?", "V čom bola vaša skupina dnes dobrá — a čo presne k tomu pomohlo?"]}, {"name": "Schéma roka & Očakávania", "qs": ["Ktorú vec z tabule si najviac chceš zapamätať, keď dnes pôjdeš domov?", "Čo potrebuješ od tejto skupiny, aby si jej mohol/la začať dôverovať?"]}]}, {"name": "Tvoríme pravidlá", "sum": "Zažiješ, že spolu to ide len vtedy, keď sa rozprávame a vieme sa dohodnúť. A spolu vytvoríme pravidlá nášho klubu.", "groups": [{"name": "Energizér – Loptičky", "qs": ["Fungovalo to tak, ako ste si to na začiatku naplánovali, alebo ste to museli zmeniť?", "Kde inde by sa oplatilo mať vopred spoločnú stratégiu, nie len to skúšať naslepo?"]}, {"name": "Stoličky", "qs": ["Museli ste zmeniť to, čo si vaša skupina na začiatku myslela, že chce? Kedy ste si to všimli?", "Kde v bežnom živote sa stretávate s tým, že vy chcete jedno a niekto iný niečo iné?"]}, {"name": "Tvorenie pravidiel", "qs": ["Bolo jednoduchšie napísať, čo nechcete, alebo čo chcete? Prečo?", "Kde inde vo svojom živote máte pravidlá, ktoré ste si sami/spoločne vytvorili — nie dostali od niekoho iného?"]}]}], "kooperativne-ucenie": [{"name": "Skús to prvýkrát", "sum": "Zistíš, že skúsiť niečo prvýkrát znamená, že to nemusí vyjsť – a že je to v poriadku, lebo bez toho sa nič nové nenaučíš.", "groups": [{"name": "Nakrúcanie", "qs": ["Čo bolo to „prvýkrát\", ktoré ste do videa dali?", "Ako sa vám rozhodovalo, či to do videa naozaj dáte, alebo pôjdete na istotu?", "Čo bolo na tom prvýkrát najťažšie?", "Čo sa stalo, keď sa vám niečo nepodarilo na prvý pokus?", "Čo ste vďaka tomu zistili, alebo čo ste urobili inak?"]}, {"name": "Eileen Gu: Skús svoj trik", "qs": ["Prečo sa podľa vás oplatí niekedy skúsiť niečo, pri čom nevieme, či to zvládneme?", "Kde by sa vám teraz oplatilo skúsiť niečo prvýkrát?"]}]}, {"name": "Skladačka", "sum": "Zažiješ, že spoločné video je hotové len vďaka tomu, že každý pridal svoj kúsok. A naučíš sa video strihať.", "groups": [{"name": "Energizér: Nájdi svoj kúsok", "qs": ["Ako ste zistili, kto má kúsok z vášho obrázka?", "Čo by sa stalo, keby jeden kúsok chýbal?"]}, {"name": "Reflexia a uzavretie", "qs": ["Čo bolo na strihu iné/náročnejšie, než ste čakali?", "Aké to bolo vidieť svoj kúsok spojený s kúskami ostatných skupín v jednom videu?", "Video ste práve poslali reálnym ľuďom v iných mestách. Ako sa to porovnáva s tým, keby ste ho robili len pre seba?", "Kde inde – mimo BI – platí, že bez tvojho kúska by niečo nebolo kompletné?"]}]}, {"name": "Karta dôkazov", "sum": "Zistíš, čo ťa ovplyvňuje, keď sa rozhoduješ a nevieš, ako to dopadne – a čo z toho použiješ nabudúce.", "groups": [{"name": "LEGO naslepo", "qs": ["Ako ste sa v skupine rozhodovali – hlasovaním, dohodou, alebo niekto jeden rozhodol za všetkých?", "Keby ste si mohli vybrať znova, rozhodli by ste sa rovnako? Prečo áno/nie?", "Čo vám to hovorí o tom, ako sa väčšinou rozhodujete, keď je niečo neisté?"]}, {"name": "Záver", "qs": ["Kde sa ti toto zíde mimo Budúcnosti INAK?", "Kedy budeš najbližšie potrebovať odvahu skúsiť niečo neisté?", "Na čo si spomenieš?"]}]}], "brainstorming": [{"name": "Rovnaký problém, iný nápad", "sum": "Vyskúšaš viac spôsobov, ako vymýšľať nápady, a zistíš, ktorý ti sedí. Nápady fungujú najlepšie, keď ich hneď nekritizujeme.", "groups": [{"name": "Charakterový mixér", "qs": ["Čo sa stalo v oboch kolách (hlasnom aj cez postavu), že vzniklo toľko nápadov?", "Čo sme si nedovolili robiť počas oboch kôl?"]}, {"name": "Záver a reflexia", "qs": ["Sedelo to, čo si vedel/a o sebe na začiatku, s tým, čo sa dnes ukázalo? Alebo si sa niečím prekvapil/a?", "Čo bolo pre teba ľahšie – vymýšľať nahlas, cez postavu, alebo potichu na papieri? Prečo?", "Bolo pre teba niektoré kolo náročné? Ktoré a prečo?", "Kde v živote (mimo BI) by sa ti zišlo vedieť rýchlo vymyslieť veľa nápadov?"]}]}, {"name": "Od problému k prototypu", "sum": "Z nápadu z brainstormingu postavíš prototyp a vyskúšaš ho na ľuďoch mimo svojho tímu.", "groups": [{"name": "Energizér: Na čo všetko sa to dá použiť", "qs": ["Všimli ste si, či ste najprv hľadali „správnu\" odpoveď, alebo ste si dovolili hocičo?"]}, {"name": "Návrat", "qs": ["Prečo ste vybrali práve tento problém?", "Čo by sa zmenilo, keby ste si vybrali najväčší problém na tabuli?"]}, {"name": "Brainstorming", "qs": ["Bolo to kolo, ktoré si čakal/a? Čo to o tebe hovorí?"]}, {"name": "Výber", "qs": ["Zmenil sa váš výber, keď sme použili kritérium „20 minút\"? Čo to hovorí o tom, ako sa bežne rozhodujete?", "Keby sme brainstorming neurobili, ktorý nápad by sme dnes stavali – ten úplne prvý, čo ste si napísali na začiatku?", "Je nápad, ktorý ste si teraz vybrali, lepší ako ten prvý? Prečo?"]}, {"name": "Prototyp", "qs": ["Čo by ste urobili inak, keby ste mali ešte 10 minút?"]}, {"name": "Mini test", "qs": ["Bolo ľahšie dať spätnú väzbu susednému tímu, alebo ju dostať od cudzích ľudí?", "Bránili ste svoj nápad, alebo ste naozaj počúvali spätnú väzbu?"]}, {"name": "Záver", "qs": ["Čo sa dnes stalo s vaším nápadom po rozhovoroch s ľuďmi?", "Čo si sa dnes o sebe dozvedel/a — ako niekto, kto rieši problémy? Bol si skôr ten, čo bránil svoj nápad, alebo ten, čo ho rád menil podľa toho, čo počul?", "Kde v bežnom živote by sa ti zišlo najprv niečo rýchlo a nedokonalo vyskúšať, než tomu venovať týždne prípravy?"]}]}], "metakognitivne-strategie": [{"name": "Cesta k učeniu", "sum": "Pri ťažkej úlohe vyskúšaš aspoň dva spôsoby, ako sa niečo naučiť. Keď jeden nefunguje, môžeš skúsiť iný.", "groups": [{"name": "Origami výzva", "qs": ["Bol tu niekto, kto sa najprv rozhodol skúšať úplne sám, bez pomoci? Čo sa stalo?", "Kam si šiel/išla ako prvé? Prečo práve tam?", "Vrátil/a si sa ešte niekam inam počas úlohy? Kedy a prečo?", "Všimol/la si si, že v energizéri aj tu si ty a ostatní vyberali rôzne veci?"]}, {"name": "Konceptualizácia", "qs": ["Ktorý z týchto spôsobov by fungoval, keby ste sa učili niečo úplne iné – nový šport, jazyk, hru?"]}, {"name": "Naučiť partnera", "qs": ["Bolo pre teba ťažšie učiť, alebo učiť sa? Prečo?"]}, {"name": "Môj návod na seba", "qs": ["Predstav si, že zajtra dostaneš v škole úlohu, ktorej vôbec nerozumieš. Čo bude prvá vec, ktorú skúsiš?"]}]}, {"name": "Beh nie o preteky", "sum": "Zistíš, že dobré rozhodnutie – v behu aj pri učení – závisí od toho, ako dobre poznáš seba.", "groups": [{"name": "Beh na odhadnutý čas", "qs": ["Zmenili ste svoj cieľ v druhom kole, alebo ste ho nechali? Prečo?", "Čo vám pomohlo lepšie trafiť svoj čas v druhom kole?", "Čo si myslíte, že je ťažšie – byť rýchly, alebo presne odhadnúť svoj vlastný výkon?", "Kde v živote je dôležitejšie „trafiť odhad\" než byť najrýchlejší?", "Čo ste museli sledovať vo svojej hlave, aby ste trafili svoj čas?"]}, {"name": "Krokomer z microbitu", "qs": ["Trafili ste sa? Bol to spôsob, ktorý ste si na začiatku tipli?", "Akú formu učenia ste si vybrali a prečo?", "Bolo pre vás jednoduchšie učiť sa z papierového návodu, z internetu, opýtaním sa niekoho, alebo vlastným pokusom a omylom? Prečo?", "Čo bol prvý signál, že váš spôsob učenia vám nefunguje (ak sa to stalo)?", "Keby ste mohli začať znova, zmenili by ste spôsob, akým ste sa to učili?", "Kedy je podľa vás lepšie opýtať sa niekoho a kedy si niečo nájsť či prečítať sami?", "V čom môže byť výhoda mať v tíme ľudí, ktorí sa učia rôznym spôsobom?", "Čo majú dnešný beh a krokomer spoločné?"]}]}, {"name": "Dva brehy, jeden most", "sum": "Budeš si všímať, či ti tvoj spôsob ešte funguje. A keď nie, zmeníš ho.", "groups": [{"name": "Čo sme si všimli", "qs": ["Čo sa stane, keď sa rozhodneš ísť jedným smerom, a uprostred cesty zistíš, že to nefunguje?", "Je to zlyhanie, keď spôsob zmeníš, alebo je to súčasť toho, ako sa niečo darí dokončiť?"]}, {"name": "Kde inde to platí", "qs": ["Kde inde – v škole, doma, na krúžku – sa ti oplatí všimnúť si, že spôsob, akým niečo robíš, nefunguje, a skúsiť iný?"]}]}], "r2-reflexia": [{"name": "Žraloci útočia", "sum": "Vyskúšaš si, ako sa pozrieť na neúspech: čo fungovalo a čo nie – bez obviňovania konkrétnych ľudí.", "groups": [{"name": "Postmortem po útoku žralokov", "qs": ["Čo vás prekvapilo, keď ste videli lístky ostatných?", "Ako sa cítite teraz, keď je všetko na jednom papieri, v porovnaní s tým, ako by ste sa cítili, keby ste o tom hovorili len s jednou osobou a bez pravidiel kruhu?", "Čo z tejto skúsenosti si viete odniesť ďalej, a kde v bežnom živote by sa vám to hodilo?"]}]}, {"name": "Myšlienka, ktorá stojí za šírenie", "sum": "Napíšeš si krátky TED Talk o tom, čo ťa quest naučil – nie o tom, čo ste robili.", "groups": [{"name": "Nájdenie jadra myšlienky", "qs": ["Bolo ťažšie vybrať jednu myšlienku, alebo sa zhodnúť v tíme, ktorá je tá pravá?", "Kedy presne ste sa v tíme zhodli na tej jednej myšlienke? Čo vás presvedčilo?"]}, {"name": "Prezentácie a spätná väzba", "qs": ["Znelo to nahlas pred skupinou tak, ako ste si to pri písaní scenára predstavovali, alebo to vyznelo inak?", "Čo si sa dnes o sebe dozvedel/a ako o niekom, kto rozpráva príbeh pred ľuďmi?", "Kde inde budeš potrebovať povedať niečo dôležité v krátkom čase tak, aby ťa ľudia naozaj počúvali?"]}]}], "r2-terenne-patranie": [{"name": "Predpoklad a realita", "sum": "Porovnáš svoj tip, čo ľudia potrebujú, s tým, čo ti naozaj povedali.", "groups": [{"name": "Porovnanie predpokladu s realitou", "qs": ["Sedel váš predpoklad s tým, čo povedali ľudia?", "Čo vás najviac prekvapilo – na probléme, alebo na reakcii na vaše riešenie?", "Zmenili by ste teraz svoje riešenie? Ako?", "Predstavte si, že by ste dnes nešli medzi ľudí a rovno by ste začali svoje riešenie vyrábať. Čo by sa mohlo stať?"]}]}, {"name": "Dobrovoľníctvo", "sum": "Nájdeš problém vo svojom okolí aj jeho skutočnú príčinu a s tímom naplánujete dobrovoľnícku akciu, ktorá sa dá naozaj urobiť.", "groups": [{"name": "Energizér – Pavučina pomoci", "qs": ["Prečo je podľa vás dobré pomáhať iným?", "Myslíte si, že vo vašom okolí sú ľudia, ktorí by potrebovali pomoc? Prípadne problémy, ktoré by bolo treba vyriešiť?", "Teraz sa ukázalo, že ste pomohli minimálne jednému človeku v tejto miestnosti – čo by sa vám mohlo podariť, keby ste spojili svoje sily?", "Čo všetko by ste mohli vyriešiť?"]}, {"name": "Náš dobrovoľnícky nápad", "qs": ["Zmenil sa váš pohľad na problém po tom, čo ste videli aj kosti ostatných skupín?", "Bolo ťažšie nájsť skutočné príčiny, než ste čakali?", "Prečo je dôležité poznať príčinu problému skôr, než navrhneme riešenie?"]}, {"name": "Plánovanie", "qs": ["Ako ste sa rozhodovali, kto akú úlohu dostane?", "Ako sa cítite, že ste práve naplánovali niečo, čo môže reálne niekomu pomôcť?", "Čo si myslíte, že pôjde pri realizácii ľahko, a čo naopak bude najťažšie?"]} function lpsOf(a){ return LP[a[3]] || []; }

  document.getElementById('grid').innerHTML = mods.map((m, i) => `

function renderLevel(){

  document.getElementById('d-eyebrow').textContent = `Level ${cur+1} · ${m.period}`;

  document.getElementById('d-goals').innerHTML = m.goals.map((g, j) =>
    `<div class="d-goal"><span class="g">${j+1}</span><span>${esc(g)}</span></div>`).join('');
  document.getElementById('d-acts').innerHTML = m.acts.map((a, k) => {
    const n = lpsOf(a).length;
    const inner = `<span class="ic">${a[0]}</span><div><h3>${esc(a[1])}</h3><p>${esc(a[2])}</p>${n ? `<span class="pill">${plural(n)}</span>` : ''}</div>`;
    return n ? `<button class="act" onclick="openAct(${k})">${inner}</button>` : `<div class="act">${inner}</div>`;
  }).join('');
  document.getElementById('d-lvl').innerHTML = `<strong>Level mám, keď…</strong> ${esc(m.level)}`;
  document.getElementById('strip').innerHTML = DATA[year].map((x, i) => `
    <button class="${i === cur ? 'on' : ''}" onclick="go(${i - cur})"${i === cur ? ' aria-current="step"' : ''}>
      <span class="s-n">Level ${i+1}${i === nowIdx ? '<span class="s-now">Teraz</span>' : ''}</span>${esc(x.title)}<span class="s-p">${x.period}</span>
    </button>`).join('');
}

function renderAct(){
  const m = DATA[year][cur], a = m.acts[curAct], lps = lpsOf(a);
  document.getElementById('a-eyebrow').textContent = `Rok ${year} · Level ${cur+1} · ${m.title}`;
  document.getElementById('a-title').textContent = a[0] + ' ' + a[1];
  document.getElementById('a-desc').textContent = a[2];
  document.getElementById('a-list').innerHTML = lps.map((l, k) => `
    <button class="lp-card" onclick="openLp(${k})">
      <h3>${esc(l.name)}</h3>
      <p>${esc(l.sum)}</p>
      <span class="pill">${l.groups.reduce((s, g) => s + g.qs.length, 0)} otázok na zamyslenie</span>
    </button>`).join('');
}

function renderLp(){
  const a = DATA[year][cur].acts[curAct], l = lpsOf(a)[curLp];
  document.getElementById('l-eyebrow').textContent = a[0] + ' ' + a[1];
  document.getElementById('l-title').textContent = l.name;
  document.getElementById('l-take').innerHTML = `<strong>Čo si dnes odnesieš</strong>${esc(l.sum)}`;
  fq = [];
  document.getElementById('l-qs').innerHTML = l.groups.map(g => `
    <div class="qgroup"><h4>${esc(g.name)}</h4>
      ${g.qs.map(q => { fq.push({q, g: g.name}); const n = fq.length; return `<button class="q" onclick="openFocus(${n-1})"><span class="qn">${n}</span><span>${esc(q)}</span></button>`; }).join('')}
    </div>`).join('');
}

function openFocus(i){ fi = i; renderFocus(); document.getElementById('focus').classList.add('on'); }
function renderFocus(){
  document.getElementById('f-q').textContent = fq[fi].q;
  document.getElementById('f-where').textContent = `${fq[fi].g} · otázka ${fi+1} z ${fq.length}`;
  document.getElementById('f-prev').disabled = fi === 0;
  document.getElementById('f-next').disabled = fi === fq.length - 1;
}
function fgo(d){ const n = fi + d; if (n < 0 || n >= fq.length) return; fi = n; renderFocus(); }
function closeFocus(){ document.getElementById('focus').classList.remove('on'); }
function focusOn(){ return document.getElementById('focus').classList.contains('on'); }

function setYear(y){
  year = y; closeFocus(); renderMap();
  const v = document.body.dataset.view;
  if (v !== 'map') { renderLevel(); view('level'); }
}
function openLevel(i){ cur = i; renderLevel(); view('level'); }
function openAct(k){ curAct = k; renderAct(); view('act'); }
function openLp(k){ curLp = k; renderLp(); view('lp'); }
function go(d){ const n = cur + d; if (n < 0 || n >= DATA[year].length) return; cur = n; renderLevel(); window.scrollTo(0,0); }
function back(){
  const v = document.body.dataset.view;
  if (v === 'lp') view('act'); else if (v === 'act') view('level'); else view('map');
}

document.addEventListener('keydown', e => {
  if (focusOn()) {
    if (e.key === 'Escape') closeFocus();
    if (e.key === 'ArrowRight') fgo(1);
    if (e.key === 'ArrowLeft') fgo(-1);
    return;
  }
  const v = document.body.dataset.view;
  if (e.key === 'Escape' && v !== 'map') back();
  if (v === 'level' && e.key === 'ArrowRight') go(1);
  if (v === 'level' && e.key === 'ArrowLeft') go(-1);
});

renderMap();
</script>
</body>
</html>
